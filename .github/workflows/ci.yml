name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medical_game
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (pytest)
        run: pytest
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medical_game

  frontend:
    name: frontend (oxlint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build
      - name: Service role key must not reach the bundle
        # spec §セキュリティ: SUPABASE_SERVICE_ROLE_KEY はバックエンド専用。
        # ビルド成果物に名前ごと現れないことを機械的に確認する。
        run: |
          if grep -RIq "SERVICE_ROLE" dist/; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY (or a service_role reference) leaked into the frontend bundle"
            grep -RIn "SERVICE_ROLE" dist/ || true
            exit 1
          fi
          echo "OK: no service-role reference in dist/"
