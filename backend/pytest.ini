[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
# settings.py は DJANGO_DEBUG の既定を False にしている（環境変数の付け忘れで
# デプロイ先にデバッグページが出るのを防ぐため）。テストも本番と同じ
# DEBUG=False で回すので、そのとき必須になる SECRET_KEY をここで渡す。
# pytest-django は conftest.py より先に Django を初期化するため、
# conftest では間に合わず pytest-env が必要。
env =
    DJANGO_SECRET_KEY=test-only-secret-key-not-for-production
