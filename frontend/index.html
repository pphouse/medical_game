<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: ノッチ/ホームインジケータの下まで描いて、余白は
         CSS の env(safe-area-inset-*) で自分で確保する。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eaf3ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1526" />
    <meta name="description" content="CBT・医師国家試験の演習アプリ。分野別演習・間隔反復の復習・友だち対戦・全国模試。" />
    <!-- ホーム画面に追加したときにブラウザの UI を出さない（Web 版の PWA）。 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="国試クイズ" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>CBT・国試対策クイズ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
